services:
  service-a:
    build:
      context: .
    command: opentelemetry-instrument uvicorn service_a.main:app --host 0.0.0.0 --port 8000 --log-config /app/logging.json
    environment:
      SECOND_SERVICE_URL: http://service-b:8001
      FASTAPI_OTEL_AUTO_CONFIGURE: "false"
      OTEL_SERVICE_NAME: service-a
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
      OTEL_TRACES_EXPORTER: otlp
      OTEL_METRICS_EXPORTER: otlp
      OTEL_PYTHON_LOG_CORRELATION: "true"
    ports:
      - "8000:8000"
    depends_on:
      service-b:
        condition: service_started
      otel-collector:
        condition: service_started

  service-b:
    build:
      context: .
    command: opentelemetry-instrument uvicorn service_b.main:app --host 0.0.0.0 --port 8001 --log-config /app/logging.json
    environment:
      FASTAPI_OTEL_AUTO_CONFIGURE: "false"
      OTEL_SERVICE_NAME: service-b
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
      OTEL_TRACES_EXPORTER: otlp
      OTEL_METRICS_EXPORTER: otlp
      OTEL_PYTHON_LOG_CORRELATION: "true"
    ports:
      - "8001:8001"
    depends_on:
      otel-collector:
        condition: service_started

  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes:
      - ./otel-collector-config.yaml:/etc/otelcol-contrib/config.yaml:ro
    ports:
      - "4317:4317"
      - "4318:4318"
      - "8889:8889"

  jaeger:
    image: jaegertracing/all-in-one:1.76.0
    command:
      - "--query.ui-config=/etc/jaeger/ui-config.json"
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    volumes:
      - ./jaeger/ui-config.json:/etc/jaeger/ui-config.json:ro
    ports:
      - "16686:16686"
    depends_on:
      otel-collector:
        condition: service_started

  prometheus:
    image: prom/prometheus:latest
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      otel-collector:
        condition: service_started

  grafana:
    image: grafana/grafana:latest
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "3000:3000"
    depends_on:
      prometheus:
        condition: service_started
